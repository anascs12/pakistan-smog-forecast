[project]
name = "pakistan-smog-forecast"
version = "1.0.0"
description = "Forecasting PM2.5 air pollution 1-3 days ahead for Lahore, Peshawar, Islamabad and Karachi, with a daily-updated forecast page."
readme = "README.md"
requires-python = "==3.12.*"
authors = [{ name = "Anas Khan" }]
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "requests>=2.31",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "plotly>=5.20",
]

[dependency-groups]
dev = ["pytest>=8"]
analysis = ["matplotlib>=3.8", "seaborn>=0.13", "jupyterlab>=4.2", "nbconvert>=7.16", "ipykernel>=6.29"]

[tool.uv]
package = true
default-groups = ["dev", "analysis"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/smog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
