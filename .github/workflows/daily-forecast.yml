name: Daily forecast

on:
  schedule:
    - cron: "30 1 * * *"  # 06:30 Pakistan time, after the previous day's data is complete
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies (forecast only)
        run: uv sync --no-default-groups --frozen

      - name: Run tests
        run: uv run --no-default-groups --with pytest pytest -q

      - name: Issue forecast
        run: uv run --no-default-groups python -m smog.forecast

      - name: Publish updated page
        run: |
          if git diff --quiet -- docs; then
            echo "No changes to publish."
            exit 0
          fi
          git config user.name "smog-forecast-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "Daily forecast for $(TZ=Asia/Karachi date +%F)"
          git push
